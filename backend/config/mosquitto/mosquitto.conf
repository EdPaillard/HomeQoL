# Mosquitto MQTT broker configuration
# Listens on the default port, no auth required (internal Docker network only).
# The broker is not exposed outside the Docker network — only gateway and
# tydom2mqtt can reach it via the internal 'personal-os' network.

listener 1883
allow_anonymous true

# Persist messages across restarts so in-flight readings aren't lost
# if the broker container is restarted while the gateway is still running.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so Docker logs captures it.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information