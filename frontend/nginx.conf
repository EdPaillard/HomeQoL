# Upstream service names match the Docker Compose service names.
# On the same Docker internal network they resolve via Docker DNS.
upstream gateway       { server homeqol-gateway:8080; }
upstream grafana       { server homeqol-grafana:3000; }
upstream transmission  { server homeqol-transmission:9091; }
upstream sonarr        { server homeqol-sonarr:8989; }
upstream radarr        { server homeqol-radarr:7878; }
upstream lidarr        { server homeqol-lidarr:8686; }
upstream prowlarr      { server homeqol-prowlarr:9696; }

# Jellyfin runs on your LOCAL machine, not Oracle.
# Replace with your laptop/N100 LAN IP or leave commented out until you have it.
# upstream jellyfin   { server 192.168.1.x:8096; }

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets — long cache, immutable ─────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Go API gateway ────────────────────────────────────────────────────────
    # All /api/ requests are forwarded to the Go backend.
    # This means VITE_API_URL can simply be /api/v1 in production.
    location /api/ {
        proxy_pass         http://gateway;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;

        # Allow large request bodies for file uploads
        client_max_body_size 10M;
    }

    # ── Grafana ───────────────────────────────────────────────────────────────
    location /grafana/ {
        proxy_pass         http://grafana;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Grafana live dashboards)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Prevent Grafana from redirecting to its internal port
        # proxy_redirect     off;
    }

    # ── Transmission ─────────────────────────────────────────────────────────
    location /transmission/ {
        proxy_pass         http://transmission/transmission/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Required — Transmission uses this header for CSRF protection
        proxy_pass_header  X-Transmission-Session-Id;
        proxy_read_timeout 60s;
    }

    # ── Sonarr ────────────────────────────────────────────────────────────────
    location /sonarr/ {
        proxy_pass       http://sonarr/sonarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect   off;
        # Prevent iframe blocking
        proxy_hide_header X-Frame-Options;
        add_header        X-Frame-Options "SAMEORIGIN";
    }

    # ── Radarr ────────────────────────────────────────────────────────────────
    location /radarr/ {
        proxy_pass       http://radarr/radarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect   off;
        proxy_hide_header X-Frame-Options;
        add_header        X-Frame-Options "SAMEORIGIN";
    }

    # ── Lidarr ────────────────────────────────────────────────────────────────
    location /lidarr/ {
        proxy_pass       http://lidarr/lidarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect   off;
        proxy_hide_header X-Frame-Options;
        add_header        X-Frame-Options "SAMEORIGIN";
    }

    # ── Prowlarr ─────────────────────────────────────────────────────────────
    location /prowlarr/ {
        proxy_pass       http://prowlarr/prowlarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect   off;
        proxy_hide_header X-Frame-Options;
        add_header        X-Frame-Options "SAMEORIGIN";
    }

    # ── Jellyfin (local machine — uncomment when available) ───────────────────
    # location /jellyfin/ {
    #     proxy_pass         http://jellyfin/;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    #     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     # WebSocket — required for Jellyfin playback sync
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    #     # Large timeout for video streaming
    #     proxy_read_timeout 600s;
    #     # Don't buffer video — stream directly
    #     proxy_buffering    off;
    #     proxy_hide_header  X-Frame-Options;
    #     add_header         X-Frame-Options "SAMEORIGIN";
    # }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # Any path not matched above goes to index.html so React handles routing.
    # This must be last.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
